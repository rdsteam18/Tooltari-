<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tooltari – Online Compiler</title>

  <!-- CodeMirror CDN for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2f;
      color: #f0f0f0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .tagline {
      font-size: 0.9rem;
      color: #aaa;
    }

    /* Advertisement Banner */
    .ad-banner {
      background: #2a2a40;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px solid #444;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .ad-banner a {
      color: #ffd700;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.1rem;
      transition: 0.2s;
    }
    .ad-banner a:hover {
      text-decoration: underline;
      color: #ffe44d;
    }
    .ad-banner span {
      color: #ccc;
    }

    /* Layout */
    .editor-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      background: #2a2a40;
      padding: 12px 16px;
      border-radius: 12px;
    }
    .top-row select,
    .top-row button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      background: #3a3a55;
      color: #fff;
      transition: 0.2s;
    }
    .top-row select:hover,
    .top-row button:hover {
      background: #4a4a6a;
    }
    .top-row button.run-btn {
      background: #6c5ce7;
      font-weight: bold;
    }
    .top-row button.run-btn:hover {
      background: #5a4bd1;
    }
    .top-row button.download-btn {
      background: #00b894;
      font-weight: bold;
    }
    .top-row button.download-btn:hover {
      background: #00a381;
    }
    .top-row .spacer {
      flex: 1;
    }

    .editor-wrapper {
      background: #282a36;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #444;
    }
    .editor-wrapper .CodeMirror {
      height: 400px;
      font-size: 14px;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .input-area label {
      font-weight: 500;
      color: #ccc;
    }
    .input-area textarea {
      background: #2a2a40;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      color: #f0f0f0;
      font-family: 'Consolas', monospace;
      resize: vertical;
      min-height: 80px;
      width: 100%;
      outline: none;
    }
    .input-area textarea:focus {
      border-color: #6c5ce7;
    }

    .output-area {
      margin-top: 20px;
      background: #1e1e2f;
      border-radius: 12px;
      border: 1px solid #444;
      padding: 16px;
      min-height: 120px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Consolas', monospace;
      font-size: 14px;
      color: #e0e0e0;
      overflow: auto;
      max-height: 400px;
    }
    .output-area .error {
      color: #ff6b6b;
    }
    .output-area .success {
      color: #69db7c;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      border-top: 1px solid #333;
      padding-top: 16px;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* responsive */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.8rem; }
      .top-row { flex-direction: column; align-items: stretch; }
      .top-row .spacer { display: none; }
      .editor-wrapper .CodeMirror { height: 250px; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>⚙️ Tooltari</h1>
    <span class="tagline">compile · run · download</span>
  </div>

  <!-- Ad Banner -->
  <div class="ad-banner">
    <span>📢</span>
    <a href="https://rentyside.in" target="_blank">rentyside.in</a>
    <span>– Your trusted rental partner. Click to explore!</span>
  </div>

  <!-- Main Editor -->
  <div class="editor-section">
    <div class="top-row">
      <select id="languageSelect">
        <option value="python">Python 3.10</option>
        <option value="cpp" selected>C++ (GCC 10.2)</option>
        <option value="java">Java (OpenJDK 17)</option>
        <option value="javascript">JavaScript (Node 16)</option>
        <option value="csharp">C# (.NET 6)</option>
      </select>

      <div class="spacer"></div>

      <button class="run-btn" id="runBtn">▶ Run</button>
      <button class="download-btn" id="downloadBtn">⬇ Download</button>
    </div>

    <div class="editor-wrapper">
      <textarea id="codeEditor"></textarea>
    </div>

    <!-- STDIN -->
    <div class="input-area">
      <label for="stdinInput">STDIN (optional)</label>
      <textarea id="stdinInput" placeholder="Enter input here..."></textarea>
    </div>

    <!-- Output -->
    <div class="output-area" id="outputArea">▶ Output will appear here</div>
  </div>

  <div class="footer">
    Tooltari · built with ❤️ · uses Piston API
  </div>
</div>

<script>
  (function() {
    // --- Init CodeMirror ---
    const editorElement = document.getElementById('codeEditor');
    const editor = CodeMirror.fromTextArea(editorElement, {
      mode: 'text/x-c++src',
      theme: 'dracula',
      lineNumbers: true,
      indentUnit: 2,
      tabSize: 2,
      autoCloseBrackets: true,
      matchBrackets: true,
    });

    // Default code sample (C++)
    editor.setValue(`#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, Tooltari!" << endl;\n    return 0;\n}`);

    // --- Language -> mode and file extension mapping ---
    const langMap = {
      python: { mode: 'python', ext: '.py', pistonLang: 'python', version: '3.10.0' },
      cpp:    { mode: 'text/x-c++src', ext: '.cpp', pistonLang: 'cpp', version: '10.2.0' },
      java:   { mode: 'text/x-java', ext: '.java', pistonLang: 'java', version: '17.0.0' },
      javascript: { mode: 'javascript', ext: '.js', pistonLang: 'javascript', version: '16.14.2' },
      csharp: { mode: 'text/x-csharp', ext: '.cs', pistonLang: 'csharp', version: '6.0.0' }
    };

    // --- Update editor mode on language change ---
    const langSelect = document.getElementById('languageSelect');
    langSelect.addEventListener('change', function() {
      const lang = this.value;
      const mode = langMap[lang].mode;
      editor.setOption('mode', mode);
    });

    // --- Run compilation ---
    const runBtn = document.getElementById('runBtn');
    const outputArea = document.getElementById('outputArea');
    const stdinInput = document.getElementById('stdinInput');

    runBtn.addEventListener('click', async function() {
      const code = editor.getValue();
      const lang = langSelect.value;
      const pistonLang = langMap[lang].pistonLang;
      const version = langMap[lang].version;
      const stdin = stdinInput.value;

      if (!code.trim()) {
        outputArea.innerHTML = '<span class="error">⚠️ Please enter some code.</span>';
        return;
      }

      // Show loading
      outputArea.innerHTML = '<span class="spinner"></span> Compiling...';

      try {
        const payload = {
          language: pistonLang,
          version: version,
          files: [{
            name: `main${langMap[lang].ext}`,
            content: code
          }],
          stdin: stdin
        };

        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Compilation service error');
        }

        // Build output
        let outputHtml = '';
        if (data.run && data.run.stdout) {
          outputHtml += `<span class="success">${escapeHtml(data.run.stdout)}</span>`;
        }
        if (data.run && data.run.stderr) {
          outputHtml += `<span class="error">${escapeHtml(data.run.stderr)}</span>`;
        }
        if (data.compile && data.compile.stderr) {
          outputHtml += `<span class="error">${escapeHtml(data.compile.stderr)}</span>`;
        }
        if (!outputHtml) {
          outputHtml = '✅ Program executed with no output.';
        }

        outputArea.innerHTML = outputHtml;

      } catch (error) {
        outputArea.innerHTML = `<span class="error">❌ Error: ${escapeHtml(error.message)}</span>`;
      }
    });

    // --- Download code ---
    const downloadBtn = document.getElementById('downloadBtn');
    downloadBtn.addEventListener('click', function() {
      const code = editor.getValue();
      const lang = langSelect.value;
      const ext = langMap[lang].ext;
      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tooltari_code${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // --- Helper: escape HTML ---
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // --- Trigger initial mode ---
    langSelect.dispatchEvent(new Event('change'));

  })();
</script>
</body>
    </html>
