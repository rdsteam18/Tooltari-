<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tooltari Compiler</title>
  <!-- Tailwind via CDN + custom baseline -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font for clean UI -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0b0e14; }
    /* custom scrollbar for dark/modern */
    .code-editor-wrap {
      background: #1e2530;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    }
    .line-numbers {
      background: #141a22;
      color: #6b7b8f;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 16px 0 16px 12px;
      min-width: 52px;
      text-align: right;
      user-select: none;
      border-right: 1px solid #2e3846;
      overflow-y: hidden;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .code-textarea {
      background: #1e2530;
      color: #e3e9f2;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 16px 16px 16px 20px;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      height: 100%;
      min-height: 420px;
      tab-size: 2;
      letter-spacing: 0.2px;
      overflow: auto;
    }
    .code-textarea::placeholder { color: #4b5a6f; }
    .code-textarea:focus { box-shadow: inset 0 0 0 1px #3e4b5e; }

    /* Turbo blue DOS style */
    .turbo-active .code-editor-wrap {
      background: #0000aa !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .turbo-active .line-numbers {
      background: #0000aa !important;
      color: #ffff55 !important;
      border-right: 1px solid #ffff55 !important;
    }
    .turbo-active .code-textarea {
      background: #0000aa !important;
      color: #ffffff !important;
    }
    .turbo-active .code-textarea::placeholder { color: #aaccff; }
    .turbo-active .top-bar-bg {
      background: #c0c0c0 !important;
      border-bottom: 2px solid #ffffff;
    }
    .turbo-active .server-btn {
      background: #c0c0c0 !important;
      color: #000000 !important;
      border: 1px solid #808080 !important;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #ffffff;
    }
    .turbo-active .server-btn.active {
      background: #0000aa !important;
      color: #ffffff !important;
      border: 1px solid #ffff55 !important;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #ffffff;
    }
    .turbo-active .menu-btn {
      background: #c0c0c0 !important;
      color: #000000 !important;
      border: 1px solid #808080;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #ffffff;
    }
    .turbo-active .menu-btn:hover {
      background: #d4d4d4 !important;
    }
    .turbo-active .output-panel {
      background: #0000aa !important;
      color: #ffffff !important;
      border-top: 2px solid #ffff55 !important;
    }
    .turbo-active .output-panel pre {
      color: #ffffff !important;
    }
    .turbo-active body {
      background: #0000aa !important;
    }
    .turbo-active .container { background: #0000aa !important; }
    .turbo-active .top-bar-bg .text-white { color: #000000 !important; }

    /* output */
    .output-panel {
      background: #141c26;
      border-radius: 0 0 12px 12px;
      border-top: 1px solid #2e3a48;
      padding: 12px 16px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #b8c9e0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output-panel pre { margin: 0; color: #b8c9e0; }

    .top-bar-bg {
      background: #1f2937;
      border-radius: 12px 12px 0 0;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 6px;
      border-bottom: 1px solid #2e3a48;
    }

    .server-btn {
      background: #2d3748;
      padding: 4px 14px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 600;
      color: #b0c4de;
      border: 1px solid #3b4a5e;
      transition: all 0.1s;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .server-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #60a5fa;
    }
    .server-btn:hover { filter: brightness(1.2); }

    .menu-btn {
      background: #2d3748;
      border: none;
      color: #d1dae8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      transition: 0.1s;
      cursor: pointer;
      border: 1px solid #3b4a5e;
    }
    .menu-btn:hover { background: #3b4a5e; }

    .shortcut-hint {
      font-size: 10px;
      color: #6b7f96;
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 30px;
      border: 1px solid #334155;
    }

    /* responsive */
    @media (max-width: 700px) {
      .top-bar-bg { flex-wrap: wrap; justify-content: center; }
      .code-textarea { min-height: 300px; }
      .line-numbers { min-width: 40px; padding-left: 6px; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 transition-colors duration-150" style="background:#0b0e14;">

<div class="container w-full max-w-6xl mx-auto transition-colors duration-150" id="appContainer">

  <!-- Top bar with server + menu -->
  <div class="top-bar-bg flex flex-wrap items-center justify-between" id="topBar">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-white font-bold text-sm tracking-wide mr-1 hidden sm:inline">⚡ Tooltari</span>
      <button data-server="c" class="server-btn active" id="srvC">C</button>
      <button data-server="cpp" class="server-btn" id="srvCpp">C++</button>
      <button data-server="js" class="server-btn" id="srvJs">JS</button>
      <button data-server="html" class="server-btn" id="srvHtml">HTML</button>
      <button data-server="turbo" class="server-btn" id="srvTurbo">🐉 Turbo</button>
    </div>
    <div class="flex flex-wrap items-center gap-1.5">
      <button class="menu-btn" id="compileBtn">▶ Compile</button>
      <button class="menu-btn" id="debugBtn">🐞 Debug</button>
      <button class="menu-btn" id="openBtn">📂 Open</button>
      <button class="menu-btn" id="saveBtn">💾 Save</button>
      <button class="menu-btn" id="clearBtn">✕ Clear</button>
      <span class="shortcut-hint hidden sm:inline-block">Ctrl+F9 · Ctrl+S</span>
    </div>
  </div>

  <!-- Editor with line numbers -->
  <div class="code-editor-wrap flex flex-col transition-colors duration-150" id="editorWrap">
    <div class="flex" style="height: 420px; min-height: 300px;">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea class="code-textarea" id="codeEditor" spellcheck="false" placeholder="Write your code here..."></textarea>
    </div>
    <!-- Output panel -->
    <div class="output-panel" id="outputPanel"><pre>// Output will appear here</pre></div>
  </div>

  <!-- hidden file input -->
  <input type="file" id="fileInput" accept=".c,.cpp,.js,.html,.txt,.h" style="display:none" />
</div>

<script>
  (function() {
    // ---------- DOM refs ----------
    const editor = document.getElementById('codeEditor');
    const lineNumbers = document.getElementById('lineNumbers');
    const output = document.getElementById('outputPanel');
    const outputPre = output.querySelector('pre') || document.createElement('pre');
    if (!output.querySelector('pre')) { output.prepend(outputPre); }

    const serverBtns = document.querySelectorAll('.server-btn');
    const container = document.getElementById('appContainer');
    const topBar = document.getElementById('topBar');
    const editorWrap = document.getElementById('editorWrap');

    // ---------- Default templates (escaped to avoid parser issues) ----------
    const TEMPLATES = {
      c: `#include <stdio.h>\n\nint main() {\n    printf("Hello from C!\\n");\n    return 0;\n}`,
      cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from C++!" << endl;\n    return 0;\n}`,
      js: `// JavaScript\nconsole.log("Hello from JS!");\nconst sum = (a, b) => a + b;\nconsole.log("2+3 =", sum(2,3));`,
      html: `\x3Chtml\x3E\n  \x3Chead\x3E\x3Ctitle\x3EPreview\x3C/title\x3E\x3C/head\x3E\n  \x3Cbody style="background:#1e293b;color:#eee;font-family:sans-serif;padding:2rem;"\x3E\n    \x3Ch1\x3EHello from HTML!\x3C/h1\x3E\n    \x3Cp\x3ELive preview inside iframe.\x3C/p\x3E\n  \x3C/body\x3E\n\x3C/html\x3E`,
      turbo: `#include <iostream.h>\n#include <conio.h>\n\nvoid main() {\n    clrscr();\n    cout << "Turbo C++ mode!";\n    getch();\n}`
    };

    // current state
    let currentServer = 'c';
    let currentTheme = 'modern'; // 'modern' or 'turbo'

    // ---------- helper: set line numbers ----------
    function updateLineNumbers() {
      const lines = editor.value.split('\n');
      const count = lines.length;
      let nums = '';
      for (let i = 1; i <= count; i++) {
        nums += i + '\n';
      }
      lineNumbers.textContent = nums;
    }

    // sync scroll
    editor.addEventListener('scroll', function() {
      lineNumbers.scrollTop = this.scrollTop;
    });

    editor.addEventListener('input', updateLineNumbers);

    // ---------- set editor content and update line numbers ----------
    function setEditorContent(code) {
      editor.value = code;
      updateLineNumbers();
    }

    // ---------- load template for server ----------
    function loadTemplate(server) {
      let code = '';
      if (server === 'c') code = TEMPLATES.c;
      else if (server === 'cpp') code = TEMPLATES.cpp;
      else if (server === 'js') code = TEMPLATES.js;
      else if (server === 'html') code = TEMPLATES.html;
      else if (server === 'turbo') code = TEMPLATES.turbo;
      setEditorContent(code);
    }

    // ---------- apply theme ----------
    function applyTheme(server) {
      const isTurbo = (server === 'turbo');
      if (isTurbo) {
        container.classList.add('turbo-active');
        currentTheme = 'turbo';
      } else {
        container.classList.remove('turbo-active');
        currentTheme = 'modern';
      }
      // active button style
      serverBtns.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.server === server) btn.classList.add('active');
      });
    }

    // ---------- switch server ----------
    function switchServer(server) {
      currentServer = server;
      applyTheme(server);
      loadTemplate(server);
      // clear output
      outputPre.textContent = `// ${server.toUpperCase()} ready`;
      // if html: preview mode hint
      if (server === 'html') {
        outputPre.textContent = '// HTML: preview will be shown in iframe after compile.';
      }
    }

    // ---------- compile / run ----------
    async function compileCode() {
      const code = editor.value;
      const server = currentServer;
      const langMap = {
        'c': { language: 'c', version: '10.2.0' },
        'cpp': { language: 'c++', version: '10.2.0' },
        'js': { language: 'javascript', version: '18.15.0' },
        'html': { language: 'html', version: '5.0' },
        'turbo': { language: 'c++', version: '10.2.0' } // turbo uses c++
      };
      
      // HTML special: live preview
      if (server === 'html') {
        // show in iframe inside output
        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '180px';
        iframe.style.border = '1px solid #2e3a48';
        iframe.style.borderRadius = '6px';
        iframe.style.background = '#fff';
        outputPre.innerHTML = '';
        outputPre.appendChild(iframe);
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
        // also show code
        const detail = document.createElement('div');
        detail.style.marginTop = '8px';
        detail.textContent = '✅ HTML preview rendered.';
        outputPre.appendChild(detail);
        return;
      }

      // JS: secure execution using Function
      if (server === 'js') {
        try {
          let logs = [];
          const originalLog = console.log;
          console.log = (...args) => { logs.push(args.map(a => String(a)).join(' ')); };
          const func = new Function(code);
          func();
          console.log = originalLog;
          outputPre.textContent = logs.length ? logs.join('\n') : '✅ JS executed successfully (no output)';
        } catch (err) {
          outputPre.textContent = '❌ JS Error: ' + err.message;
        }
        return;
      }

      // C / C++ / Turbo => piston API
      const lang = langMap[server]?.language || 'c';
      const version = langMap[server]?.version || '10.2.0';
      // For turbo we use c++ but with a different flavor? we keep as c++
      const pistonLang = (server === 'turbo') ? 'c++' : lang;
      
      try {
        const resp = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: pistonLang,
            version: version,
            files: [{ content: code }]
          })
        });
        const data = await resp.json();
        if (data.run && data.run.output) {
          let out = data.run.output;
          if (data.run.stderr) out += '\n' + data.run.stderr;
          outputPre.textContent = out || '✅ Compilation successful (no output)';
        } else if (data.message) {
          outputPre.textContent = '⚠️ ' + data.message;
        } else {
          outputPre.textContent = '⚠️ Unknown response from Piston API';
        }
      } catch (e) {
        outputPre.textContent = '❌ API Error: ' + e.message;
      }
    }

    // ---------- save file ----------
    function saveFile() {
      const code = editor.value;
      const extMap = { 'c': 'c', 'cpp': 'cpp', 'js': 'js', 'html': 'html', 'turbo': 'cpp' };
      const ext = extMap[currentServer] || 'txt';
      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tooltari_code.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ---------- open file ----------
    function openFile() {
      document.getElementById('fileInput').click();
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        setEditorContent(ev.target.result);
        // also detect server from extension? 
        const name = file.name.toLowerCase();
        if (name.endsWith('.c')) switchServer('c');
        else if (name.endsWith('.cpp') || name.endsWith('.h')) switchServer('cpp');
        else if (name.endsWith('.js')) switchServer('js');
        else if (name.endsWith('.html') || name.endsWith('.htm')) switchServer('html');
        // else keep current server
      };
      reader.readAsText(file);
      this.value = ''; // reset
    });

    // ---------- debug mock ----------
    function debugMock() {
      alert('🐞 Debugger: mock breakpoint at line 1 (simulated)');
    }

    // ---------- clear output ----------
    function clearOutput() {
      outputPre.textContent = '// Output cleared';
      if (currentServer === 'html') {
        outputPre.innerHTML = '// HTML preview cleared';
      }
    }

    // ---------- event binding ----------
    serverBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const server = this.dataset.server;
        if (server === currentServer) return;
        switchServer(server);
      });
    });

    document.getElementById('compileBtn').addEventListener('click', compileCode);
    document.getElementById('debugBtn').addEventListener('click', debugMock);
    document.getElementById('openBtn').addEventListener('click', openFile);
    document.getElementById('saveBtn').addEventListener('click', saveFile);
    document.getElementById('clearBtn').addEventListener('click', clearOutput);

    // keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'F9') {
        e.preventDefault();
        compileCode();
      }
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        saveFile();
      }
    });

    // ---------- init ----------
    switchServer('c');
  })();
</script>
</body>
    </html>
